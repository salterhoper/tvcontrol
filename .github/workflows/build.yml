name: Build

# Fast feedback on every push and PR: typecheck the dashboard and build both
# debug APKs (TV server + phone remote) so breakage is caught before a release.

on:
  push:
    branches-ignore:
      - "gh-pages"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci || npm install
      - name: Typecheck dashboard
        working-directory: dashboard
        run: npm run typecheck

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # Skip the action's default obsolete `tools` package (it no longer
          # exists and fails); we install the real packages next.
          packages: ""

      - name: Install SDK packages
        run: |
          # The androidx dependencies require compileSdk 37, so we must build
          # against android-37. Install it if the sdkmanager repo offers it;
          # otherwise rely on the platform preinstalled on the runner image.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" || true
          sdkmanager "platforms;android-37" || echo "android-37 not in sdkmanager repo; relying on a preinstalled platform"
          echo "Installed platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(none)"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs (TV + phone)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :phone:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/phone/build/outputs/apk/debug/phone-debug.apk
          if-no-files-found: error
