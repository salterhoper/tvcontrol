name: Release

# Builds and publishes both APKs:
#   * the TV app  (the server that runs on the Android TV)        -> tvcontrol-tv-<ver>.apk
#   * the phone remote (the client people drive the TV with)      -> tvcontrol-remote-<ver>.apk
#
# Trigger it by pushing a tag like `v0.2.0`, or run it by hand from the Actions
# tab and type a version. Signing is optional: set the ANDROID_KEYSTORE_* repo
# secrets to sign with your own key, otherwise the release APKs are debug-signed
# (which still installs fine for sideloading).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # A monotonic versionCode so every release sorts above the last.
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (versionCode ${{ github.run_number }})"

      - name: Set up Node (the dashboard is built into the TV APK)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Don't let the action install the obsolete `tools` package (its
          # default) - it no longer exists and fails. We install what we need
          # in the next step.
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "Release APKs will be signed with the provided keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set - release APKs will be debug-signed (still installable)."
          fi

      - name: Build both release APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            :app:assembleRelease :phone:assembleRelease

      - name: Collect and rename APKs
        id: apks
        run: |
          mkdir -p dist
          TV=android/app/build/outputs/apk/release/app-release.apk
          PHONE=android/phone/build/outputs/apk/release/phone-release.apk
          cp "$TV" "dist/tvcontrol-tv-${{ steps.ver.outputs.name }}.apk"
          cp "$PHONE" "dist/tvcontrol-remote-${{ steps.ver.outputs.name }}.apk"
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TV Control ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ### TV Control ${{ steps.ver.outputs.name }}

            | APK | Install it on |
            | --- | --- |
            | `tvcontrol-tv-${{ steps.ver.outputs.name }}.apk` | the **Android TV** (the server that runs in the background) |
            | `tvcontrol-remote-${{ steps.ver.outputs.name }}.apk` | your **phone or tablet** (the remote that drives the TV) |

            Install the TV APK on the television, open it and turn on the
            accessibility engine, then install the remote APK on your phone,
            pair with the PIN shown on the TV, and you are in control.
