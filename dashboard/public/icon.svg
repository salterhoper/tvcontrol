<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161b"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee1c4"/>
      <stop offset="100%" stop-color="#2c6f62"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#262f39" stroke-width="4"/>
  
  <!-- TV Body Outline -->
  <rect x="86" y="100" width="340" height="230" rx="28" fill="#1a2028" stroke="#5ee1c4" stroke-width="8" filter="url(#glow)"/>
  <!-- TV Stand -->
  <path d="M216 332 L196 390 L316 390 L296 332 Z" fill="#262f39"/>
  <rect x="176" y="390" width="160" height="12" rx="6" fill="#5ee1c4"/>

  <!-- Inside Screen - D-Pad graphic -->
  <circle cx="256" cy="215" r="54" fill="#12161b" stroke="#2c6f62" stroke-width="4"/>
  <circle cx="256" cy="215" r="22" fill="url(#accentG)"/>
  
  <!-- Directional arrow indicators -->
  <path d="M256 174 L251 184 L261 184 Z" fill="#5ee1c4"/>
  <path d="M256 256 L251 246 L261 246 Z" fill="#5ee1c4"/>
  <path d="M215 215 L225 210 L225 220 Z" fill="#5ee1c4"/>
  <path d="M297 215 L287 210 L287 220 Z" fill="#5ee1c4"/>
  
  <!-- Signal waves -->
  <path d="M216 66 C236 50, 276 50, 296 66" fill="none" stroke="#5ee1c4" stroke-width="6" stroke-linecap="round"/>
  <path d="M232 80 C242 72, 270 72, 280 80" fill="none" stroke="#5ee1c4" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
